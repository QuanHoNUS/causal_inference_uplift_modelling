[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-campaign-causal-capstone"
version = "1.0.0"
description = "Reproducible causal inference and uplift modeling capstone"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "econml>=0.15",
    "lightgbm>=4.0",
    "networkx>=3.0",
    "jupyter>=1.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
